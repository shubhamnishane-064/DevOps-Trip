# toolkit.conf - settings for the Server Health & Backup Toolkit
# Edit the values, keep no spaces around "="

# Folder to back up
SOURCE_DIR="$HOME/projects"

# Where backups, reports and logs are saved
BACKUP_DIR="$HOME/toolkit/backups"
REPORT_DIR="$HOME/toolkit/reports"
LOG_FILE="$HOME/toolkit/toolkit.log"

# Keep backups for this many days
KEEP_DAYS=7

# Warning limits
DISK_LIMIT=80
MEM_LIMIT=80
WARN_TEMP=70
CRIT_TEMP=85

# Services to check (space separated)
SERVICES="ssh cron"